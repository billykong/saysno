# Unit tests, the scripted-model loop tests and the M1 line budget, on every
# pull request and on main. Nothing here needs an API key.
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v6
    - run: uv sync --locked
    - run: uv run pytest -q
    - run: echo "agent lines $(uv run python scripts/loc.py)" >> "$GITHUB_STEP_SUMMARY"
