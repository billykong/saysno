difficulty = "hard"
kind = "fix"
provokes = ["two-bugs"]
protected = []
ticket = """The March 2025 revenue report doesn't match finance: \
`python -m csvreport data/march_2025.csv --group region --sum amount --month 2025-03`. \
The file mixes ISO dates with UK-style dd/mm/yyyy dates."""

[[bug]]
file = "csvreport/values.py"
old = '''("%Y-%m-%d", "%d/%m/%Y")'''
new = '''("%Y-%m-%d", "%m/%d/%Y")'''

[[bug]]
file = "csvreport/report.py"
old = '''start <= parse_date(row[date_column]) < end'''
new = '''start <= parse_date(row[date_column]) <= end'''

